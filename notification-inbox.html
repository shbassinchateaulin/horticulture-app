<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications</title><style>:root{--g:#07583f;--bg:#f5f8f5;--line:#e1e8e3;--txt:#173126;--mut:#6d7d75}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--txt)}.wrap{padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.top h1{font-size:18px;margin:0}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:750;font-size:12px;color:var(--g)}.list{display:grid;gap:9px}.card{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;display:grid;grid-template-columns:38px 1fr;gap:10px;cursor:pointer}.icon{width:38px;height:38px;border-radius:11px;background:#edf6f0;display:grid;place-items:center}.card b{display:block;font-size:13px}.card p{margin:4px 0 0;color:#56665d;font-size:12px;line-height:1.35}.meta{font-size:10px;color:#8a948f;margin-top:6px}.empty,.loading,.error{padding:28px 12px;text-align:center;color:var(--mut);font-size:13px}.error{color:#9b2c2c}.hint{font-size:10px;color:#8a948f;margin-top:10px;text-align:center}</style></head><body><div class="wrap"><div class="top"><h1>Notifications</h1><div class="actions"><button id="readAll" class="btn">Tout marquer comme lu</button><button id="clearAll" class="btn">Tout effacer</button></div></div><div id="list" class="loading">Chargement…</div><div class="hint">Les notifications de plus de 30 jours sont automatiquement retirées.</div></div><script src="./notification-inbox.js?v=1"></script></body></html>
