<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications</title><style>:root{--g:#07583f;--bg:#fff;--line:#e7ece8;--txt:#173126;--mut:#6d7d75}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--txt)}button{font:inherit}.wrap{padding:10px 12px 12px}.top{display:flex;align-items:center;justify-content:flex-end;min-height:34px;margin-bottom:5px}.btn{border:0;background:#eef6f1;border-radius:10px;padding:8px 11px;font-weight:800;font-size:11px;color:var(--g);cursor:pointer}.btn:disabled{opacity:.35;cursor:default}.list{display:grid;gap:4px}.card{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:11px 4px;display:grid;grid-template-columns:40px 1fr 18px;gap:10px;align-items:center;cursor:pointer;text-align:left;color:var(--txt);border-radius:10px}.card:hover{background:#f8fbf9}.card:last-child{border-bottom:0}.icon{width:40px;height:40px;border-radius:12px;background:#edf6f0;color:var(--g);display:grid;place-items:center}.icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.card b{display:block;font-size:13px;line-height:1.25}.card p{margin:3px 0 0;color:#56665d;font-size:12px;line-height:1.35}.meta{font-size:10px;color:#8a948f;margin-top:5px}.chev{font-size:24px;line-height:1;color:#a2ada7}.empty,.error{padding:34px 12px;text-align:center;color:var(--mut);font-size:13px}.emptyIcon{width:46px;height:46px;margin:0 auto 9px;border-radius:15px;background:#edf6f0;display:grid;place-items:center;color:var(--g)}.emptyIcon svg{width:23px;height:23px}.error{color:#9b2c2c}.hint{font-size:9px;color:#9aa39e;margin-top:8px;text-align:center}.skeleton{display:grid;gap:8px;padding:4px 0}.sk{height:58px;border-radius:12px;background:linear-gradient(90deg,#f2f5f3 25%,#fafbfa 37%,#f2f5f3 63%);background-size:400% 100%;animation:sh 1.1s ease infinite}@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}</style></head><body><div class="wrap"><div class="top"><button id="readAll" class="btn">Tout marquer comme lu</button></div><div id="list"><div class="skeleton"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div><div class="hint">Les notifications sont automatiquement retirées après 30 jours.</div></div><script src="./notification-inbox.js?v=3"></script></body></html>
