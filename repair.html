<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Réparation de l'application</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f8f5;color:#173126;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.card{width:min(92vw,460px);background:#fff;border:1px solid #e1e8e3;border-radius:18px;padding:26px;box-shadow:0 12px 40px #17312618;text-align:center}
h1{font-size:22px;margin:0 0 10px}.msg{color:#64746c;font-size:14px;line-height:1.5}.ok{color:#07583f;font-weight:800}.err{color:#b42318;font-weight:800}
</style>
<script>
(async()=>{
  const set=(t,c='msg')=>{const el=document.getElementById('status');if(el){el.className=c;el.textContent=t}};
  async function repair(){
    try{
      set('Nettoyage du cache et des service workers…');
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
      }
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k).catch(()=>false)));
      }
      try{localStorage.removeItem('horticulture-health-mode')}catch(_){}
      set('Réparation terminée. Redémarrage…','ok');
      setTimeout(()=>location.replace('./?repaired='+Date.now()),700);
    }catch(e){
      set('La réparation automatique a échoué : '+(e?.message||e),'err');
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',repair,{once:true});
  else repair();
})();
</script>
</head>
<body>
<div class="card">
<h1>Réparation de l'application</h1>
<div id="status" class="msg">Préparation…</div>
</div>
</body>
</html>
