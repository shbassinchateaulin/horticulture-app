<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07583f"><title>Réunion — Société d’Horticulture</title><style>html,body{margin:0;height:100%;background:#0d2019;font-family:Arial,Helvetica,sans-serif}body{display:flex;flex-direction:column}.top{height:58px;flex:0 0 58px;background:#07583f;color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;box-sizing:border-box}.top b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top button{border:0;border-radius:11px;background:#ffffff18;color:#fff;padding:9px 12px;font-weight:800}.meet{flex:1;min-height:0;position:relative}.meet iframe{width:100%!important;height:100%!important;border:0!important}.loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:#0d2019;z-index:1}.error{max-width:560px;margin:auto;padding:20px;line-height:1.5}.error b{display:block;font-size:20px;margin-bottom:8px}</style><script src="https://meet.jit.si/external_api.js"></script></head><body><div class="top"><button id="back">← Retour</button><b id="title">Réunion</b><button id="copy">Copier le lien</button></div><div id="meet" class="meet"><div class="loading" id="loading">Connexion à la réunion…</div></div><script>(()=>{const q=new URLSearchParams(location.search),room=(q.get('room')||'').replace(/[^A-Za-z0-9_-]/g,''),mode=q.get('mode')==='audio'?'audio':'video',name=(q.get('name')||'Membre').slice(0,80),title=(q.get('title')||'Réunion').slice(0,120);document.getElementById('title').textContent=title;document.getElementById('back').onclick=()=>{if(history.length>1)history.back();else location.href='./'};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);const b=document.getElementById('copy');b.textContent='Lien copié';setTimeout(()=>b.textContent='Copier le lien',1500)}catch{}};const load=document.getElementById('loading');if(!room){load.innerHTML='<div class="error"><b>Réunion introuvable</b>Le lien de réunion est incomplet.</div>';return}if(typeof JitsiMeetExternalAPI!=='function'){load.innerHTML='<div class="error"><b>Service vidéo indisponible</b>Impossible de charger le service de visioconférence pour le moment.</div>';return}try{const api=new JitsiMeetExternalAPI('meet.jit.si',{roomName:room,parentNode:document.getElementById('meet'),width:'100%',height:'100%',lang:'fr',userInfo:{displayName:name},configOverwrite:{startWithVideoMuted:mode==='audio',startWithAudioMuted:false,prejoinPageEnabled:false,disableDeepLinking:true}});api.addListener('videoConferenceJoined',()=>load?.remove());api.addListener('readyToClose',()=>{if(history.length>1)history.back();else location.href='./'});api.addListener('cameraError',()=>{if(mode==='video')load?.remove()});setTimeout(()=>load?.remove(),7000)}catch(e){load.innerHTML='<div class="error"><b>Impossible de rejoindre la réunion</b>Réessayez dans quelques instants.</div>'}})();</script></body></html>
