name: Add Super Admin preview

on:
  push:
    paths:
      - '.github/workflows/add-superadmin-preview.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Super Admin preview and access management
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # 1) Temporary preview access on login screen.
          old='<button class="connect">→ &nbsp; Se connecter</button><div id="status" class="sm" style="margin-top:10px"></div>'
          new='<button class="connect">→ &nbsp; Se connecter</button><button type="button" id="previewAdmin" class="previewAdmin">Aperçu Super Admin</button><div id="status" class="sm" style="margin-top:10px"></div>'
          if old in s:
              s=s.replace(old,new,1)

          # 2) Styling for preview button and access-management UI.
          css='''<style id="superadmin-preview-v1">
          .previewAdmin{width:100%;height:46px;border:1px solid #cfe2d6;border-radius:14px;background:#f3faf6;color:#07583f;font-weight:800;margin-top:10px}
          .accessHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}.accessHead h1{margin:0}.accessHead .primary{width:auto;margin:0;padding:0 16px}
          .userCard{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:16px;margin-top:10px;background:#fff}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#edf6f0;color:var(--g2);font-weight:850}.userMeta{flex:1}.userMeta b{display:block}.userMeta small{color:var(--mut)}.statusOk{font-size:11px;font-weight:800;color:#176340;background:#dff2e6;border-radius:999px;padding:4px 8px}.accessInfo{margin-top:16px;padding:14px;border-radius:15px;background:#f3f7f4;border:1px solid var(--line);font-size:12px;color:var(--mut);line-height:1.45}
          </style>'''
          if 'superadmin-preview-v1' not in s:
              s=s.replace('</head>',css+'</head>',1)

          # 3) Make both Gestion des accès entries navigate to the new view.
          s=s.replace('<button class="space" data-permission="acces">','<button class="space" data-permission="acces" data-go="access">',1)
          s=s.replace('<button>⚙ &nbsp; Gestion des accès</button>','<button data-go="access">⚙ &nbsp; Gestion des accès</button>',1)

          # 4) Add the access-management page.
          marker='</section></main><nav class="bottom">'
          access='''</section><section id="access" class="view"><button class="back" data-go="home">← Retour</button><div class="page"><div class="accessHead"><div><h1>Gestion des accès</h1><div class="sm">Comptes, rôles, droits et mots de passe</div></div><button class="primary" type="button" id="newUser">＋ Utilisateur</button></div><div class="userCard"><div class="avatar">SA</div><div class="userMeta"><b>Super Admin</b><small>Accès complet • compte de prévisualisation</small></div><span class="statusOk">Actif</span></div><div class="accessInfo"><b>Prochaine étape :</b> ici tu pourras créer un membre, lui attribuer un rôle, choisir précisément ses droits, envoyer son accès par e-mail, désactiver son compte et déclencher une réinitialisation de mot de passe. La partie mot de passe sera reliée à un vrai service d’authentification sécurisé avant utilisation réelle.</div></div>'''
          if marker in s and 'id="access"' not in s:
              s=s.replace(marker,access+'</main><nav class="bottom">',1)

          # 5) Add a Super Admin preview session without storing a real password in source.
          target="forgot.onclick=()=>status.textContent='La récupération par e-mail sera activée avec le serveur sécurisé.';"
          addition="""forgot.onclick=()=>status.textContent='La récupération par e-mail sera activée avec le serveur sécurisé.';const SUPER_PREVIEW={firstName:'Super',lastName:'Admin',role:'Super Admin',permissions:['communication','sorties','adherents','comptabilite','suggestions','acces']};previewAdmin.onclick=()=>{apply(SUPER_PREVIEW);login.style.display='none';app.style.display='block';go('home')};newUser?.addEventListener('click',()=>alert('La création réelle de comptes sera activée avec le serveur sécurisé.'));"""
          if target in s and 'SUPER_PREVIEW' not in s:
              s=s.replace(target,addition,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable Super Admin preview and access management" || exit 0
          git push
