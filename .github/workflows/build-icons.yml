name: Fix PWA logo

on:
  push:
    paths:
      - '.github/workflows/build-icons.yml'

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace broken logo references
        run: |
          sed -i 's/logo-admin\.jpg/logo-admin.png/g' index.html
          sed -i 's/logo-admin\.webp/logo-admin.png/g' index.html
          sed -i 's/logo-admin\.jpg/logo-admin.png/g' manifest.webmanifest || true
          sed -i 's/logo-admin\.webp/logo-admin.png/g' manifest.webmanifest || true
          sed -i 's/logo-admin\.jpg/logo-admin.png/g' sw.js || true
          sed -i 's/logo-admin\.webp/logo-admin.png/g' sw.js || true

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest sw.js
          git commit -m "Use valid PNG administration logo everywhere" || exit 0
          git push
