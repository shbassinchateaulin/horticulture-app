name: Build PWA icons

on:
  push:
    paths:
      - '.github/workflows/build-icons.yml'

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Generate PNG icons and update PWA files
        run: |
          python - <<'PY'
          from PIL import Image
          import json
          from pathlib import Path

          src = Image.open('logo-admin.webp').convert('RGBA')
          for size, name in [(192, 'icon-192.png'), (512, 'icon-512.png'), (180, 'apple-touch-icon.png')]:
              im = src.copy()
              im.thumbnail((size, size), Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (size, size), (255,255,255,0))
              x = (size-im.width)//2
              y = (size-im.height)//2
              canvas.alpha_composite(im, (x,y))
              canvas.save(name, optimize=True)

          manifest_path = Path('manifest.webmanifest')
          data = json.loads(manifest_path.read_text(encoding='utf-8'))
          data['icons'] = [
              {'src':'icon-192.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'icon-512.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}
          ]
          manifest_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index = Path('index.html').read_text(encoding='utf-8')
          index = index.replace('<link rel="apple-touch-icon" href="logo-admin.webp" id="appleTouchIcon">', '<link rel="apple-touch-icon" href="apple-touch-icon.png">')
          Path('index.html').write_text(index, encoding='utf-8')

          sw = Path('sw.js').read_text(encoding='utf-8')
          sw = sw.replace("horticulture-admin-v5", "horticulture-admin-v6")
          if "icon-192.png" not in sw:
              sw = sw.replace("'./logo-admin.webp'", "'./logo-admin.webp','./icon-192.png','./icon-512.png','./apple-touch-icon.png'")
          Path('sw.js').write_text(sw, encoding='utf-8')
          PY

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png apple-touch-icon.png manifest.webmanifest index.html sw.js
          git commit -m "Generate PNG icons for PWA" || exit 0
          git push
