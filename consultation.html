<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07583f"><title>Consultation — Société d’Horticulture</title><style>:root{--g:#07583f;--g2:#063d2f;--bg:#f4f7f4;--txt:#173126;--mut:#6b7b73;--line:#dfe8e2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:28px 18px 42px}.heroInner{max-width:760px;margin:auto}.brand{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}.brandName{font-size:20px;font-weight:800;margin-top:4px}.wrap{max-width:760px;margin:-22px auto 50px;padding:0 14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 14px 36px #063d2f10}.title{font-size:29px;line-height:1.08;margin:0;color:var(--txt)}.sub{color:var(--mut);line-height:1.55;margin:9px 0 0}.progress{height:7px;background:#edf2ee;border-radius:99px;overflow:hidden;margin:22px 0}.progress span{display:block;height:100%;background:var(--g);width:0}.section h2{font-size:22px;margin:0 0 5px}.desc{color:var(--mut);font-size:13px;margin-bottom:18px}.q{padding:17px 0;border-top:1px solid #edf1ee}.q:first-of-type{border-top:0}.q b{display:block;font-size:15px;margin-bottom:9px}.req{color:#b42318}.q textarea,.q select,.q input[type=text]{width:100%;border:1px solid #d4dfd8;border-radius:11px;padding:12px;background:#fff;color:var(--txt);font:inherit}.q textarea{min-height:105px;resize:vertical}.choices{display:grid;gap:8px}.choice{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid #e0e8e3;border-radius:11px;background:#fbfdfb}.choice input{margin-top:2px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.btn{border:1px solid #d9e3dd;background:#fff;color:#29483d;border-radius:11px;padding:12px 17px;font-weight:800}.btn.primary{background:var(--g);border-color:var(--g);color:#fff;margin-left:auto}.btn:disabled{opacity:.55}.notice{background:#edf7f1;border:1px solid #d9eadf;padding:14px;border-radius:13px;color:#496057;margin:16px 0}.error{background:#fff0f0;border-color:#f0cccc;color:#9f2d27}.thanks{text-align:center;padding:28px 8px}.thanks .icon{font-size:48px}.tiny{text-align:center;color:#839087;font-size:11px;margin:18px 0}@media(max-width:600px){.hero{padding-top:24px}.brandName{font-size:17px}.card{padding:18px}.title{font-size:25px}.actions{position:sticky;bottom:0;background:#fff;padding-top:12px;padding-bottom:calc(4px + env(safe-area-inset-bottom))}}</style></head><body><header class="hero"><div class="heroInner"><div class="brand">Société d’Horticulture et d’Art Floral</div><div class="brandName">du Bassin de Châteaulin</div></div></header><main class="wrap"><div id="app" class="card"><div class="sub">Chargement de la consultation…</div></div><div class="tiny">Vos réponses sont transmises directement à l’association.</div></main><script src="./consultation-public-v1.js?v=1"></script></body></html>
