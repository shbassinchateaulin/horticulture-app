<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publications — Société d’Horticulture</title><style>:root{--g:#536b4a;--ink:#28342d;--mut:#66736c;--bg:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1080px;margin:auto;padding:18px}.hero{min-height:230px;background:linear-gradient(135deg,#6f8265,#4f6549);display:flex;align-items:end;justify-content:center;padding:42px 18px;color:#fff}.hero h1{font:700 44px Georgia,serif;margin:0}.filters{display:flex;gap:8px;justify-content:center;padding:16px;position:sticky;top:0;background:#fffc;backdrop-filter:blur(10px);z-index:3}.filters button{border:1px solid #d8dfda;background:#fff;border-radius:999px;padding:9px 14px;font-weight:700}.filters button.on{background:#536b4a;color:#fff;border-color:#536b4a}.list{display:grid;gap:38px}.post{padding-bottom:34px;border-bottom:1px solid #edf0ee}.post:last-child{border-bottom:0}.cover{width:100%;max-height:530px;object-fit:cover;display:block}.post h2{font:700 34px Georgia,serif;margin:20px 0 8px}.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:13px;margin-bottom:17px}.text{font-size:17px;line-height:1.72;white-space:pre-wrap}.gallery{display:grid;gap:8px;margin:20px 0}.gallery.g2,.gallery.g4{grid-template-columns:1fr 1fr}.gallery.g3,.gallery.g5{grid-template-columns:1.25fr .75fr}.gallery img{width:100%;height:220px;object-fit:cover}.gallery.g3 img:first-child{grid-row:span 2;height:448px}.cta{display:inline-flex;background:#0b8759;color:#fff;text-decoration:none;padding:14px 18px;border-radius:7px;font-weight:800;margin-top:18px}.empty{text-align:center;color:var(--mut);padding:60px 20px}@media(max-width:640px){.wrap{padding:12px}.hero{min-height:190px}.hero h1{font-size:38px}.post h2{font-size:29px}.text{font-size:16px}.gallery img,.gallery.g3 img:first-child{height:180px}.gallery.g3,.gallery.g5{grid-template-columns:1fr 1fr}.cta{display:flex;justify-content:center;width:100%}}</style></head><body><div class="hero"><h1 id="heading">Publications</h1></div><div class="filters"><button data-filter="all" class="on">Tout</button><button data-filter="news">Actualités</button><button data-filter="sortie">Sorties</button></div><main class="wrap"><div id="list" class="list"><div class="empty">Chargement…</div></div></main><script>const API='https://script.google.com/macros/s/AKfycbwim8t9oVshwze47JG0KeuvdiE3hqjwM6pXts9KA48HSd-jLOP5A3V2cyfN6nVMSp5H/exec';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[],filter=new URLSearchParams(location.search).get('type')||'all';function fmt(v){if(!v)return'';try{return new Intl.DateTimeFormat('fr-FR',{dateStyle:'long',timeStyle:'short'}).format(new Date(v))}catch{return v}}function render(){document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('on',b.dataset.filter===filter));const list=document.getElementById('list'),a=rows.filter(x=>filter==='all'||x.type===filter);document.getElementById('heading').textContent=filter==='sortie'?'Sorties':filter==='news'?'Actualités':'Publications';list.innerHTML=a.length?a.map(p=>{const imgs=Array.isArray(p.images)?p.images:[],hero=imgs[0],rest=imgs.slice(1,6);return `<article class="post">${hero?`<img class="cover" src="${esc(hero)}" alt="">`:''}<h2>${esc(p.title)}</h2><div class="meta">${p.date?`<span>${esc(fmt(p.date))}</span>`:''}${p.location?`<span>${esc(p.location)}</span>`:''}</div><div class="text">${esc(p.text)}</div>${rest.length?`<div class="gallery g${Math.min(rest.length,5)}">${rest.map(x=>`<img src="${esc(x)}" alt="">`).join('')}</div>`:''}${p.type==='sortie'&&p.helloassoUrl&&(!p.date||Date.parse(p.date)>=Date.now()-43200000)?`<a class="cta" href="${esc(p.helloassoUrl)}" target="_blank" rel="noopener">S’inscrire / Payer sur HelloAsso</a>`:''}</article>`}).join(''):'<div class="empty">Aucune publication pour le moment.</div>'}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});fetch(API+'?action=listPublicPublications&t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{rows=Array.isArray(j.publications)?j.publications:[];render()}).catch(()=>document.getElementById('list').innerHTML='<div class="empty">Les publications sont momentanément indisponibles.</div>');</script></body></html>
